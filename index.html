<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = 'system';
        try { theme = localStorage.getItem('liturgy.theme') || 'system'; } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && theme !== 'dark' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        let accent = 'green';
        try { accent = localStorage.getItem('liturgy.accent') || 'green'; } catch {}
        document.documentElement.dataset.accent = ['green', 'blue', 'purple', 'rose', 'amber'].includes(accent) ? accent : 'green';
      })();
    </script>
    <style>
      html { background: #f8f9f6; }
      html[data-theme="dark"] { background: #101a17; }
      body { margin: 0; }
      #app-startup {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 32px;
        background: #f8f9f6;
        color: #285747;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
      }
      [data-theme="dark"] #app-startup { background: #101a17; color: #93d5b3; }
      #app-startup ~ #root { visibility: hidden; }
      #app-startup img { width: 88px; height: 88px; object-fit: contain; }
      #app-startup strong { margin-top: 20px; font-size: 22px; font-weight: 700; }
      #app-startup p { margin: 10px 0 24px; font-size: 14px; }
      .startup-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid transparent;
        border-top-color: currentColor;
        border-right-color: currentColor;
        border-radius: 50%;
        animation: startup-spin 0.9s linear infinite;
      }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .startup-spinner { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ministrantappka" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#234f41" />
    <meta name="description" content="Wspólny grafik służby liturgicznej. Sprawdź dyżury, zapisz się na Mszę i zaplanuj swoją służbę." />
    <title>Ministrantappka</title>
  </head>
  <body>
    <div id="app-startup" role="status" aria-live="polite">
      <img src="/logo.png" alt="" width="88" height="88" />
      <strong>Ministrantappka</strong>
      <p>Ładowanie aplikacji…</p>
      <span class="startup-spinner" aria-hidden="true"></span>
      <noscript>Włącz JavaScript w przeglądarce, aby uruchomić aplikację.</noscript>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

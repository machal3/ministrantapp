<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = 'system';
        try { theme = localStorage.getItem('liturgy.theme') || 'system'; } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && theme !== 'dark' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        let accent = 'green';
        try { accent = localStorage.getItem('liturgy.accent') || 'green'; } catch {}
        document.documentElement.dataset.accent = ['green', 'blue', 'purple', 'rose', 'amber'].includes(accent) ? accent : 'green';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ministrantappka" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#234f41" />
    <meta name="description" content="Wspólny grafik służby liturgicznej. Sprawdź dyżury, zapisz się na Mszę i zaplanuj swoją służbę." />
    <title>Ministrantappka</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

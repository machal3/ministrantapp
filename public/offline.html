<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#245c46">
  <link rel="icon" type="image/png" href="/logo.png">
  <title>Brak połączenia · Ministrantappka</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 16px/1.65 "Segoe UI", system-ui, sans-serif; background: #f4f7f5; color: #203c30; margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 440px; background: white; border: 1px solid #dce5df; border-radius: 16px; padding: clamp(24px, 6vw, 40px); box-shadow: 0 4px 20px #203c3006; }
    .offline-logo { width: 44px; height: 44px; object-fit: contain; margin-bottom: 12px; }
    small { color: #245c46; font-weight: 600; }
    h1 { font-size: 28px; line-height: 1.3; letter-spacing: -.6px; margin: 8px 0 12px; }
    p { color: #5e7067; margin: 0 0 24px; }
    a { display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 10px; padding: 11px 16px; background: #245c46; color: white; font-weight: 600; text-decoration: none; }
    a:hover { background: #1c4436; }
    a:focus-visible { outline: 3px solid #358768; outline-offset: 3px; }
  </style>
</head>
<body><main><img src="/logo.png" alt="" class="offline-logo" /><br /><small>Ministrantappka</small><h1>Brak połączenia</h1><p>Połącz się z internetem, aby zobaczyć aktualny grafik i zarządzać zapisami.</p><a href="/">Spróbuj ponownie</a></main></body>
</html>
